# Visits the site once a day so the free Supabase project is never paused for inactivity.
name: Keep database awake
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - run: curl -fsS "${{ vars.SITE_URL }}/" -o /dev/null
